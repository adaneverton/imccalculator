<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Lines — catálogo</title>
<meta name="description" content="Catálogo de produtos impressos em 3D. Escolha, monte seu pedido e envie direto no WhatsApp.">
<meta name="theme-color" content="#011e5a">
<meta name="robots" content="index, follow">

<!-- Compartilhamento em redes e WhatsApp -->
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Five Lines — catálogo">
<meta property="og:description" content="Escolha os produtos, monte seu pedido e envie direto no WhatsApp.">
<meta property="og:image" content="../assets/img/logo.png">

<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="catalogo.css">
<!-- Sem fontes, scripts, pixels ou rastreadores de terceiros. -->
</head>
<body class="sem-barra">

<!-- Ícones e desenhos usados quando o produto ainda não tem foto -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-whats" viewBox="0 0 24 24" fill="currentColor">
    <path d="M17.5 14.4c-.3-.2-1.7-.8-1.9-.9-.3-.1-.5-.2-.6.2-.2.3-.7.9-.8 1-.2.2-.3.2-.6.1s-1.2-.5-2.3-1.4c-.9-.8-1.4-1.7-1.6-2s0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5s0-.4 0-.5-.6-1.5-.9-2.1c-.2-.5-.5-.4-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 .9-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 5 4.3.7.3 1.2.5 1.7.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2.2A9.8 9.8 0 0 0 3.6 17l-1.4 5.1 5.2-1.4A9.8 9.8 0 1 0 12 2.2zm0 17.9c-1.5 0-2.9-.4-4.1-1.1l-.3-.2-3.1.8.8-3-.2-.3a8.1 8.1 0 1 1 6.9 3.8z"/>
  </symbol>
  <symbol id="i-compartilhar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/>
    <path d="m8.4 10.8 7.2-4.2M8.4 13.2l7.2 4.2"/>
  </symbol>
  <symbol id="i-instagram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.7"/><circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-busca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>
  <symbol id="i-relogio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/>
  </symbol>
  <symbol id="i-caminhao" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h11v10H3zM14 9h4l3 3.2V16h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>
  </symbol>
  <symbol id="i-cartao" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M6.5 14.5h3"/>
  </symbol>
  <symbol id="i-escudo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.8 20 6v6c0 4.6-3.3 7.9-8 9.2C7.3 19.9 4 16.6 4 12V6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/>
  </symbol>

  <!-- desenhos genéricos (usados enquanto não há foto do produto) -->
  <symbol id="d-vaso" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 24h36c-6 12-8 22-8 32s4 20 10 30c4 7-2 14-10 14H50c-8 0-14-7-10-14 6-10 10-20 10-30s-2-20-8-32z"/>
    <path d="M44 46h32M44 62h34M46 80h30" opacity=".5"/>
  </symbol>
  <symbol id="d-caixa" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 44h72v46H24z"/><path d="M24 62h72M60 44v46" opacity=".55"/><path d="M34 34v10M44 30v14" opacity=".7"/>
  </symbol>
  <symbol id="d-peca" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 26v10M60 84v10M94 60H84M36 60H26M84 36l-7 7M43 77l-7 7M84 84l-7-7M43 43l-7-7"/>
    <circle cx="60" cy="60" r="24"/><circle cx="60" cy="60" r="10"/>
  </symbol>
  <symbol id="d-estrela" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m60 24 10 22 24 3-17 17 4 24-21-11-21 11 4-24-17-17 24-3z"/>
    <path d="M40 100h40" opacity=".5"/>
  </symbol>
  <symbol id="d-cubo" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 20 96 40v40L60 100 24 80V40z"/><path d="m24 40 36 20 36-20M60 60v40" opacity=".55"/>
  </symbol>
</svg>

<!-- ============ TOPO ============ -->
<header class="topo">
  <div class="wrap topo__inner">
    <div class="topo__marca">
      <img class="topo__logo" src="../assets/img/logo-light.png" alt="Five Lines" width="720" height="235">
      <h1 class="sr-only" id="lojaNome">Five Lines</h1>
      <p id="lojaSlogan">Impressão 3D sob medida</p>
    </div>
    <div class="topo__acoes">
      <a class="icone-btn" id="linkInsta" href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg aria-hidden="true"><use href="#i-instagram"></use></svg>
      </a>
      <button class="icone-btn" id="compartilhar" type="button" aria-label="Compartilhar catálogo">
        <svg aria-hidden="true"><use href="#i-compartilhar"></use></svg>
      </button>
      <a class="icone-btn" data-whats href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
        <svg aria-hidden="true"><use href="#i-whats"></use></svg>
      </a>
    </div>
  </div>

  <div class="wrap topo__info">
    <span><svg aria-hidden="true"><use href="#i-relogio"></use></svg> <span id="pePrazo"></span></span>
    <span><svg aria-hidden="true"><use href="#i-caminhao"></use></svg> <span id="peEntrega"></span></span>
  </div>
</header>

<!-- ============ BUSCA E FILTROS ============ -->
<div class="barra-busca">
  <div class="wrap">
    <div class="busca">
      <svg aria-hidden="true"><use href="#i-busca"></use></svg>
      <label class="sr-only" for="campoBusca">Buscar produto</label>
      <input type="search" id="campoBusca" placeholder="Buscar no catálogo" autocomplete="off">
      <button class="busca__limpar" id="limparBusca" type="button" aria-label="Limpar busca">
        <svg width="14" height="14" aria-hidden="true"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por categoria"></div>
  </div>
</div>

<!-- ============ PRODUTOS ============ -->
<main class="wrap">
  <h2 class="sr-only">Produtos</h2>
  <div class="grade" id="grade"></div>

  <noscript>
    <p class="vazio">
      Para ver o catálogo é preciso ativar o JavaScript no navegador.<br>
      Se preferir, chame a gente no WhatsApp que enviamos as fotos e os preços.
    </p>
  </noscript>
</main>

<!-- ============ RODAPÉ ============ -->
<footer class="rodape">
  <div class="wrap">
    <div class="rodape__linhas">
      <div><svg aria-hidden="true"><use href="#i-relogio"></use></svg> <span>Prazo médio de produção: <span id="pePrazo2"></span></span></div>
      <div><svg aria-hidden="true"><use href="#i-caminhao"></use></svg> <span id="peEntrega2"></span></div>
      <div><svg aria-hidden="true"><use href="#i-cartao"></use></svg> <span id="pePagamento"></span></div>
    </div>

    <p id="peAviso"></p>

    <div class="rodape__fim">
      <span>&copy; <span id="peAno">2026</span> <span id="peNome">Five Lines</span></span>
      <span class="privacidade">
        <svg aria-hidden="true"><use href="#i-escudo"></use></svg>
        Sem cookies e sem rastreadores
      </span>
    </div>
  </div>
</footer>

<!-- ============ BARRA DO PEDIDO ============ -->
<div class="pedido-barra" id="pedidoBarra">
  <div class="pedido-barra__info">
    <strong id="barraQtd">0 itens</strong>
    <span id="barraTotal"></span>
  </div>
  <button class="btn btn--marca" id="verPedido" type="button">Ver pedido</button>
</div>

<!-- ============ PAINEL (produto e pedido) ============ -->
<div class="painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="painelTitulo">
  <div class="painel__fundo" id="painelFundo"></div>
  <div class="painel__caixa">
    <div class="painel__topo">
      <h2 id="painelTitulo"></h2>
      <p id="painelSub"></p>
      <button class="painel__fechar" id="painelFechar" type="button" aria-label="Fechar">
        <svg aria-hidden="true"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="painel__conteudo" id="painelConteudo"></div>
    <div class="painel__pe" id="painelPe"></div>
  </div>
</div>

<div class="copiado" id="copiado" role="status" aria-live="polite"></div>

<script src="produtos.js"></script>
<script src="catalogo.js"></script>
</body>
</html>
